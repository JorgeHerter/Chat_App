// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    // CRITICAL: We are removing explicit SDK version definitions 
    // (buildToolsVersion, minSdkVersion, etc.) to stop the conflict 
    // with the 'expo-root-project' plugin.
    
    // Set a stable, modern Kotlin version. Trying 1.7.10 as a known stable 
    // version for recent React Native/Expo SDKs.
    kotlinVersion = '1.7.10'
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    // Ensure the Kotlin plugin uses the version defined above
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}") 
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
