// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    // CRITICAL: These build versions are required by Expo plugins
    // to apply their configuration correctly.
    buildToolsVersion = "34.0.0" 
    minSdkVersion = 24 
    compileSdkVersion = 34
    targetSdkVersion = 34
    
    // Set a stable, modern Kotlin version compatible with recent Expo SDKs
    // This fixed the previous 'compileDebugKotlin' failure.
    kotlinVersion = '1.8.20'
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    // Ensure the Kotlin plugin uses the version defined above
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}") 
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"